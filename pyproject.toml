[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "herdlab"
version = "0.1.0"
description = "Research tools for studying latent crowding in simulated trading-agent populations."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "PyYAML",
    "scikit-learn",
    "lightgbm",
]

[tool.setuptools.packages.find]
include = ["herdlab*"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

