# Plain baseline parameters for development and pipeline smoke tests.
# These are uncalibrated simulation defaults, not claims about real markets.
simulation:
  n_steps: 500
  initial_price: 100.0
  realized_vol_lookback: 20

# Two-state exogenous return process. Rows of transition_matrix describe the
# probability of moving from the current regime to each next regime.
exogenous:
  initial_regime: 0
  transition_matrix:
    - [0.98, 0.02]
    - [0.10, 0.90]
  regime_volatility: [0.001, 0.004]
  jump_probability: 0.005
  jump_scale: 0.01
  liquidity:
    mean: 1000.0
    persistence: 0.95
    innovation_scale: 0.05
    minimum: 100.0
  background_flow:
    scale: 50.0
    persistence: 0.20

# The initial scaffold uses factor agents only. Later plan steps add learned
# families while retaining a total baseline population of 30 agents.
agents:
  population_size: 30
  momentum_fraction: 0.50
  lookback: 20
  q_max: 10.0
  risk_aversion_k: 2.0
  order_limit: 2.0
  epsilon: 1.0e-8
  parameter_dispersion: 0.10
  feature_overlap: 0.50
  initial_cash: 10000.0
  transaction_cost_rate: 0.0001
  risk:
    max_drawdown: 0.20
    max_leverage: 2.0
    liquidation_steps: 5

market:
  impact_model: linear
  impact_sensitivity: 0.001

# Future unwind labels use a ten-step horizon. Their event threshold must be
# fitted from training episodes and therefore is intentionally not hard-coded.
targets:
  unwind_horizon: 10

