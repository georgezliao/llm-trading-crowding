# Generated by the pre-registered impact x leverage grid.
# The selected values must be applied identically to every v2 split.
simulation:
  n_steps: 500
  initial_price: 100.0
  realized_vol_lookback: 20
exogenous:
  initial_regime: 0
  transition_matrix:
  - - 0.98
    - 0.02
  - - 0.1
    - 0.9
  regime_volatility:
  - 0.001
  - 0.004
  jump_probability: 0.005
  jump_scale: 0.01
  liquidity:
    mean: 1000.0
    persistence: 0.95
    innovation_scale: 0.05
    minimum: 100.0
  background_flow:
    scale: 50.0
    persistence: 0.2
agents:
  population_size: 30
  momentum_fraction: 0.5
  momentum:
    count: 6
  reversion:
    count: 6
  lookback: 20
  q_max: 200.0
  risk_aversion_k: 2.0
  order_limit: 40.0
  epsilon: 1.0e-08
  parameter_dispersion: 0.1
  feature_overlap: 0.5
  learned_overlap_mode: none
  private_signal:
    strength: 0.0
    beta: 1.0
    rng_stream: 2
  linear:
    count: 6
    lookback: 5
    ridge_alpha: 0.0001
    refit_interval: 10
    training_window: 100
    min_samples: 20
  gbdt:
    count: 6
    lookback: 5
    refit_interval: 50
    training_window: 100
    min_samples: 20
    n_estimators: 12
    learning_rate: 0.05
    num_leaves: 7
  mlp:
    count: 6
    lookback: 5
    refit_interval: 50
    training_window: 100
    min_samples: 20
    hidden_size: 8
    epochs: 20
    learning_rate: 0.03
    l2: 0.0001
  initial_cash: 10000.0
  transaction_cost_rate: 0.0001
  risk:
    enabled: true
    max_drawdown: 0.2
    max_leverage: 2.0
    liquidation_steps: 5
    cooldown_steps: 20
market:
  impact_model: linear
  impact_sensitivity: 0.03
targets:
  unwind_horizon: 10
